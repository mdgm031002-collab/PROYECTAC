
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080d18">
  <title>Ojos Digitales</title>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #080d18;
      color: white;
      font-family: Arial, sans-serif;
    }

    #inicio {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      background: radial-gradient(circle, #123b2c, #080d18 65%);
      z-index: 5;
    }

    .contenido {
      width: 100%;
      max-width: 430px;
      padding: 35px 25px;
      border: 1px solid #00ff78;
      border-radius: 25px;
      background: rgba(5, 15, 25, .9);
      box-shadow: 0 0 35px #00ff7833;
    }

    .ojo {
      font-size: 75px;
      margin-bottom: 15px;
      color: #00ff78;
    }

    h1 {
      font-size: 35px;
      margin-bottom: 15px;
      letter-spacing: 2px;
    }

    h1 span { color: #00ff78; }

    p {
      color: #b9c5d2;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: #00ff78;
      color: #001b0c;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
    }

    #camara {
      display: none;
      position: fixed;
      inset: 0;
      background: black;
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .panel {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      padding: 15px;
      border: 1px solid #00ff78;
      border-radius: 12px;
      background: rgba(0, 0, 0, .75);
      text-align: center;
    }

    #resultado {
      position: absolute;
      bottom: 95px;
      left: 15px;
      right: 15px;
      padding: 18px;
      border: 1px solid #00ff78;
      border-radius: 15px;
      background: rgba(0, 0, 0, .8);
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      display: none;
    }

    #detener {
      position: absolute;
      bottom: 20px;
      left: 15px;
      right: 15px;
      width: calc(100% - 30px);
      background: #ff4545;
      color: white;
    }
  </style>
</head>

<body>

  <!-- PANTALLA DE INICIO -->
  <section id="inicio">
    <div class="contenido">
      <div class="ojo">◉</div>

      <h1>OJOS <span>DIGITALES</span></h1>

      <p>
        Explora tu entorno mediante inteligencia artificial.
        Nuestro sistema reconocerá los objetos utilizando la cámara.
      </p>

      <button id="iniciar">INICIAR EXPERIENCIA</button>
    </div>
  </section>

  <!-- PANTALLA DE CÁMARA -->
  <section id="camara">
    <video id="video" autoplay playsinline muted></video>

    <div class="panel">
      <strong>OJOS DIGITALES</strong>
      <p id="estado" style="margin:8px 0 0">Preparando sistema...</p>
    </div>

    <div id="resultado" aria-live="polite"></div>

    <button id="detener">DETENER SISTEMA</button>
  </section>

  <script>
    const URL_MODELO =
      "https://teachablemachine.withgoogle.com/models/z892YD6q4/";

    const inicio = document.getElementById("inicio");
    const camara = document.getElementById("camara");
    const video = document.getElementById("video");
    const estado = document.getElementById("estado");
    const resultado = document.getElementById("resultado");

    let modelo = null;
    let etiquetas = [];
    let stream = null;
    let activo = false;
    let procesando = false;
    let ultimoObjeto = "";
    let ultimoAviso = 0;

    async function cargarModelo() {
      await tf.ready();

      const respuesta = await fetch(URL_MODELO + "metadata.json");

      if (!respuesta.ok) {
        throw new Error("No se pudo cargar la información del modelo.");
      }

      const metadata = await respuesta.json();
      etiquetas = metadata.labels;

      if (!etiquetas || etiquetas.length === 0) {
        throw new Error("El modelo no tiene etiquetas.");
      }

      modelo = await tf.loadLayersModel(
        URL_MODELO + "model.json"
      );
    }

    async function iniciarCamara() {
      if (!navigator.mediaDevices?.getUserMedia) {
        throw new Error("La cámara requiere HTTPS y un navegador compatible.");
      }

      stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: {
          facingMode: { ideal: "environment" }
        }
      });

      video.srcObject = stream;

      await new Promise((resolve, reject) => {
        video.onloadedmetadata = resolve;
        video.onerror = reject;
      });

      await video.play();
    }

    async function iniciarSistema() {
      const boton = document.getElementById("iniciar");
      boton.disabled = true;
      boton.textContent = "INICIANDO...";

      try {
        inicio.style.display = "none";
        camara.style.display = "block";

        estado.textContent = "Activando cámara...";
        await iniciarCamara();

        estado.textContent = "Cargando inteligencia artificial...";
        await cargarModelo();

        activo = true;
        estado.textContent = "Sistema activo";
        reconocer();

        hablar("Ojos Digitales está listo.");
      } catch (error) {
        console.error(error);
        detenerCamara();

        camara.style.display = "none";
        inicio.style.display = "flex";

        boton.disabled = false;
        boton.textContent = "INTENTAR DE NUEVO";

        alert(error.message || "No se pudo iniciar el sistema.");
      }
    }

    function hablar(texto) {
      if (!("speechSynthesis" in window)) return;

      speechSynthesis.cancel();

      const voz = new SpeechSynthesisUtterance(texto);
      voz.lang = "es-MX";
      voz.rate = 1;

      speechSynthesis.speak(voz);
    }

    async function reconocer() {
      if (!activo || procesando) return;

      if (video.readyState < 2) {
        requestAnimationFrame(reconocer);
        return;
      }

      procesando = true;

      try {
        const entrada = tf.tidy(() => {
          return tf.browser.fromPixels(video)
            .resizeBilinear([224, 224])
            .toFloat()
            .div(127.5)
            .sub(1)
            .expandDims(0);
        });

        const prediccion = modelo.predict(entrada);
        const datos = await prediccion.data();

        entrada.dispose();
        prediccion.dispose();

        let indice = 0;

        for (let i = 1; i < datos.length; i++) {
          if (datos[i] > datos[indice]) {
            indice = i;
          }
        }

        const confianza = datos[indice];
        const objeto = etiquetas[indice];

        if (
          confianza >= 0.75 &&
          !["fondo", "background", "vacio", "vacío"]
            .includes(objeto.toLowerCase())
        ) {
          resultado.style.display = "block";

          resultado.textContent =
            objeto.toUpperCase() +
            " · " +
            Math.round(confianza * 100) +
            "%";

          estado.textContent = "Objeto identificado";

          const ahora = Date.now();

          if (
            objeto !== ultimoObjeto ||
            ahora - ultimoAviso > 4000
          ) {
            hablar(objeto);
            ultimoObjeto = objeto;
            ultimoAviso = ahora;
          }

        } else {
          resultado.style.display = "none";
          estado.textContent = "Analizando entorno...";
        }

      } catch (error) {
        console.error("Error de reconocimiento:", error);
        estado.textContent = "Error al analizar imagen";
      } finally {
        procesando = false;
      }

      if (activo) {
        requestAnimationFrame(reconocer);
      }
    }

    function detenerCamara() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }

      video.srcObject = null;
    }

    function detenerSistema() {
      activo = false;
      detenerCamara();

      if ("speechSynthesis" in window) {
        speechSynthesis.cancel();
      }

      camara.style.display = "none";
      inicio.style.display = "flex";

      resultado.style.display = "none";

      const boton = document.getElementById("iniciar");
      boton.disabled = false;
      boton.textContent = "INICIAR EXPERIENCIA";
    }

    document.getElementById("iniciar")
      .addEventListener("click", iniciarSistema);

    document.getElementById("detener")
      .addEventListener("click", detenerSistema);

    window.addEventListener("pagehide", detenerCamara);
  </script>

</body>
</html>
